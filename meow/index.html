<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Meow — WingSwing</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --tg-bg: #0f1a24;
      --tg-surface: #172431;
      --tg-surface-active: #1f3142;
      --tg-accent: #2aabee;
      --tg-text: #ffffff;
      --tg-text-secondary: #708499;
      --tg-border: rgba(255, 255, 255, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--tg-bg);
      color: var(--tg-text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .header {
      position: sticky;
      top: 0;
      height: 56px;
      background: var(--tg-surface);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 20px;
      border-bottom: 1px solid var(--tg-border);
      z-index: 10;
    }

    .menu-btn {
      background: none;
      border: none;
      color: var(--tg-text);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .menu-btn:active { background: var(--tg-surface-active); }
    .header-title { font-size: 19px; font-weight: 600; }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 20;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }

    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      background: var(--tg-surface);
      z-index: 30;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
    }
    .drawer.active { transform: translateX(0); }

    .drawer-header {
      padding: 24px 20px;
      background: linear-gradient(135deg, #1d3347, #172431);
      border-bottom: 1px solid var(--tg-border);
    }

    .drawer-logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--tg-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      margin-bottom: 12px;
    }

    .drawer-title { font-size: 17px; font-weight: 600; }
    .drawer-subtitle { font-size: 13px; color: var(--tg-accent); margin-top: 2px; }
    .drawer-menu { list-style: none; padding: 8px 0; }

    .drawer-item a {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 24px;
      color: var(--tg-text);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
    }

    .drawer-item a:active,
    .drawer-item.active a {
      background: var(--tg-surface-active);
      color: var(--tg-accent);
    }

    .drawer-item i { font-size: 19px; width: 24px; text-align: center; color: var(--tg-text-secondary); }
    .drawer-item.active i { color: var(--tg-accent); }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--tg-surface);
      border-radius: 14px;
      padding: 24px 16px;
      border: 1px solid var(--tg-border);
      text-align: center;
    }

    .cat-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2aabee, #136996);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      color: #fff;
      margin: 0 auto 16px;
      user-select: none;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cat-avatar:active { transform: scale(1.15) rotate(6deg); }

    .cat-counter {
      font-size: 32px;
      font-weight: 700;
      color: var(--tg-accent);
      margin: 8px 0;
    }

    .cat-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: var(--tg-accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: transform 0.1s;
    }

    .cat-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <header class="header">
    <button class="menu-btn" id="openMenuBtn"><i class="fa-solid fa-bars"></i></button>
    <div class="header-title">Meow</div>
  </header>

  <div class="overlay" id="overlay"></div>

  <nav class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="drawer-logo"><i class="fa-solid fa-feather-pointed"></i></div>
      <div class="drawer-title">WingSwing</div>
      <div class="drawer-subtitle">wingswing.xyz</div>
    </div>
    <ul class="drawer-menu">
      <li class="drawer-item"><a href="/"><i class="fa-solid fa-house"></i><span>Главная</span></a></li>
      <li class="drawer-item"><a href="/about"><i class="fa-solid fa-circle-info"></i><span>О проекте</span></a></li>
      <li class="drawer-item"><a href="/download"><i class="fa-solid fa-download"></i><span>Загрузки</span></a></li>
      <li class="drawer-item active"><a href="/meow"><i class="fa-solid fa-cat"></i><span>Meow</span></a></li>
    </ul>
  </nav>

  <main class="container">
    <div class="card">
      <div class="cat-avatar" id="catIcon"><i class="fa-solid fa-cat"></i></div>
      <h2>Ты нашёл секретный раздел</h2>
      <p style="color: var(--tg-text-secondary); margin-top: 6px; font-size: 14px;">Нажми на котика или кнопку ниже:</p>
      
      <div class="cat-counter" id="countDisplay">0</div>
      
      <button class="cat-btn" id="meowBtn">
        <i class="fa-solid fa-paw"></i>
        <span>Сказать Meow</span>
      </button>
    </div>
  </main>

  <script>
    const openMenuBtn = document.getElementById('openMenuBtn');
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');
    function toggleMenu(open) {
      drawer.classList.toggle('active', open);
      overlay.classList.toggle('active', open);
    }
    openMenuBtn.addEventListener('click', () => toggleMenu(true));
    overlay.addEventListener('click', () => toggleMenu(false));

    let count = 0;
    const countDisplay = document.getElementById('countDisplay');
    const meowBtn = document.getElementById('meowBtn');
    const catIcon = document.getElementById('catIcon');

    function clickMeow() {
      count++;
      countDisplay.textContent = count;
      catIcon.style.transform = 'scale(1.2) rotate(' + (Math.random() * 20 - 10) + 'deg)';
      setTimeout(() => catIcon.style.transform = 'scale(1)', 150);
    }

    meowBtn.addEventListener('click', clickMeow);
    catIcon.addEventListener('click', clickMeow);
  </script>
</body>
</html>
