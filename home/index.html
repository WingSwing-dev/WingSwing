<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WingSwing</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --tg-bg: #0f1a24;
      --tg-surface: #172431;
      --tg-surface-active: #1f3142;
      --tg-accent: #2aabee;
      --tg-accent-hover: #2297d3;
      --tg-text: #ffffff;
      --tg-text-secondary: #708499;
      --tg-border: rgba(255, 255, 255, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--tg-bg);
      color: var(--tg-text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Верхняя панель */
    .header {
      position: sticky;
      top: 0;
      height: 56px;
      background: var(--tg-surface);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 20px;
      border-bottom: 1px solid var(--tg-border);
      z-index: 10;
    }

    .menu-btn {
      background: none;
      border: none;
      color: var(--tg-text);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .menu-btn:active {
      background: var(--tg-surface-active);
    }

    .header-title {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    /* Затемнение фона */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 20;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Боковое меню (Drawer) */
    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      background: var(--tg-surface);
      z-index: 30;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
    }

    .drawer.active {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 24px 20px;
      background: linear-gradient(135deg, #1d3347, #172431);
      border-bottom: 1px solid var(--tg-border);
    }

    .drawer-logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--tg-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(42, 171, 238, 0.3);
    }

    .drawer-title {
      font-size: 17px;
      font-weight: 600;
    }

    .drawer-subtitle {
      font-size: 13px;
      color: var(--tg-accent);
      margin-top: 2px;
    }

    .drawer-menu {
      list-style: none;
      padding: 8px 0;
    }

    .drawer-item a {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 24px;
      color: var(--tg-text);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: background 0.15s;
    }

    .drawer-item a:active,
    .drawer-item.active a {
      background: var(--tg-surface-active);
      color: var(--tg-accent);
    }

    .drawer-item i {
      font-size: 19px;
      width: 24px;
      text-align: center;
      color: var(--tg-text-secondary);
    }

    .drawer-item.active i {
      color: var(--tg-accent);
    }

    /* Контент страницы */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--tg-surface);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid var(--tg-border);
    }

    .welcome-card {
      text-align: center;
      padding: 28px 16px;
      background: linear-gradient(180deg, #182736 0%, #172431 100%);
    }

    .brand-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2aabee, #136996);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #fff;
      margin: 0 auto 14px;
      box-shadow: 0 6px 18px rgba(42, 171, 238, 0.25);
    }

    .brand-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .brand-desc {
      font-size: 14px;
      color: var(--tg-text-secondary);
      margin-top: 6px;
    }

    .section-label {
      font-size: 13px;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: var(--tg-accent);
      margin-bottom: 8px;
    }

    /* Ссылки на страницы */
    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
      text-decoration: none;
      color: var(--tg-text);
      transition: background 0.15s;
    }

    .nav-row:active {
      background: var(--tg-surface-active);
    }

    .nav-row-left {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 15px;
      font-weight: 500;
    }

    .nav-row-left i {
      font-size: 18px;
      color: var(--tg-accent);
      width: 22px;
      text-align: center;
    }

    .nav-row-arrow {
      color: var(--tg-text-secondary);
      font-size: 14px;
    }

    /* Бейдж-кнопки (GitHub / Telegram) */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .badge-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      text-decoration: none;
      color: #ffffff;
      background: #1e2d3b;
      border: 1px solid var(--tg-border);
      transition: transform 0.1s, opacity 0.15s;
    }

    .badge-btn:active {
      transform: scale(0.98);
      opacity: 0.85;
    }

    .badge-btn i {
      font-size: 26px;
      width: 30px;
      text-align: center;
    }

    .badge-text {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .badge-text .subtitle {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--tg-text-secondary);
    }

    .badge-text .title {
      font-size: 16px;
      font-weight: 600;
    }

    .badge-btn.tg {
      background: var(--tg-accent);
      border: none;
    }

    .badge-btn.tg .subtitle {
      color: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <header class="header">
    <button class="menu-btn" id="openMenuBtn">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="header-title">WingSwing</div>
  </header>

  <!-- Затемнение экрана -->
  <div class="overlay" id="overlay"></div>

  <!-- Меню «три полоски» -->
  <nav class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="drawer-logo">
        <i class="fa-solid fa-feather-pointed"></i>
      </div>
      <div class="drawer-title">WingSwing</div>
      <div class="drawer-subtitle">wingswing.xyz</div>
    </div>
    <ul class="drawer-menu">
      <li class="drawer-item active">
        <a href="/">
          <i class="fa-solid fa-house"></i>
          <span>Главная</span>
        </a>
      </li>
      <li class="drawer-item">
        <a href="/about">
          <i class="fa-solid fa-circle-info"></i>
          <span>О проекте</span>
        </a>
      </li>
      <li class="drawer-item">
        <a href="/download">
          <i class="fa-solid fa-download"></i>
          <span>Загрузки</span>
        </a>
      </li>
      <li class="drawer-item">
        <a href="/meow">
          <i class="fa-solid fa-cat"></i>
          <span>Meow</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Контент -->
  <main class="container">
    <!-- Приветственная карточка -->
    <div class="card welcome-card">
      <div class="brand-icon">
        <i class="fa-solid fa-feather-pointed"></i>
      </div>
      <div class="brand-title">WingSwing</div>
      <div class="brand-desc">Персональное пространство и проекты</div>
    </div>

    <!-- Быстрая навигация по сайту -->
    <div class="card">
      <div class="section-label">Разделы</div>
      <div class="nav-list">
        <a href="/about" class="nav-row">
          <div class="nav-row-left">
            <i class="fa-solid fa-circle-info"></i>
            <span>О проекте</span>
          </div>
          <i class="fa-solid fa-chevron-right nav-row-arrow"></i>
        </a>

        <a href="/download" class="nav-row">
          <div class="nav-row-left">
            <i class="fa-solid fa-download"></i>
            <span>Загрузки и файлы</span>
          </div>
          <i class="fa-solid fa-chevron-right nav-row-arrow"></i>
        </a>

        <a href="/meow" class="nav-row">
          <div class="nav-row-left">
            <i class="fa-solid fa-cat"></i>
            <span>Секретный meow</span>
          </div>
          <i class="fa-solid fa-chevron-right nav-row-arrow"></i>
        </a>
      </div>
    </div>

    <!-- Кнопки профилей -->
    <div class="card">
      <div class="section-label">Связь и профили</div>
      <div class="btn-group">
        <a href="https://t.me/grace_fansd" target="_blank" rel="noopener noreferrer" class="badge-btn tg">
          <i class="fa-brands fa-telegram"></i>
          <div class="badge-text">
            <span class="subtitle">Direct message</span>
            <span class="title">Мой Telegram</span>
          </div>
        </a>

        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="badge-btn">
          <i class="fa-brands fa-github"></i>
          <div class="badge-text">
            <span class="subtitle">Get it on</span>
            <span class="title">GitHub</span>
          </div>
        </a>
      </div>
    </div>
  </main>

  <script>
    const openMenuBtn = document.getElementById('openMenuBtn');
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');

    function toggleMenu(isOpen) {
      if (isOpen) {
        drawer.classList.add('active');
        overlay.classList.add('active');
      } else {
        drawer.classList.remove('active');
        overlay.classList.remove('active');
      }
    }

    openMenuBtn.addEventListener('click', () => toggleMenu(true));
    overlay.addEventListener('click', () => toggleMenu(false));
  </script>
</body>
</html>
