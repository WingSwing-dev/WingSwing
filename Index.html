<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WingSwing Projects</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 2rem; color: #58a6ff; margin-bottom: 8px; }
    header p { color: #8b949e; font-size: 0.95rem; }
    .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; width: 100%; max-width: 450px; }
    .card h2 { font-size: 1.3rem; color: #f0f6fc; margin-bottom: 8px; }
    .card p { color: #8b949e; font-size: 0.9rem; line-height: 1.4; margin-bottom: 20px; }
    .badge-btn { display: inline-flex; align-items: center; background-color: #21262d; color: #f0f6fc; text-decoration: none; padding: 10px 18px; border-radius: 8px; border: 1px solid #30363d; }
    .badge-btn svg { width: 24px; height: 24px; fill: #f0f6fc; margin-right: 12px; }
    .badge-btn .subtext { font-size: 9px; font-weight: 600; text-transform: uppercase; color: #8b949e; display: block; }
    .badge-btn .title { font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <h1>WingSwing</h1>

  </header>
  <main class="card">
